name: Update members index
on:
  push:
    branches: [main]
    paths: ['members/**/README.md']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MEMBERS.md
        run: |
          {
            echo "# Members"; echo
            echo "| Member | Title |"; echo "|---|---|"
            for f in members/*/README.md; do
              d=$(basename "$(dirname "$f")")
              t=$(grep -m1 '^# ' "$f" | sed 's/^# //')
              echo "| [$d]($f) | ${t:--} |"
            done
          } > MEMBERS.md
      - name: Commit if changed
        run: |
          git config user.name sync-bot
          git config user.email sync-bot@users.noreply.github.com
          git add MEMBERS.md
          git diff --cached --quiet || { git commit -m "Update members index" && git push; }
